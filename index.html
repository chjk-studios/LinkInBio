<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link in Bio website Maker</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="_assets/css/main.css" />
</head>
<body>
<main>
<h1>Link in bio maker!</h1>

<textarea id="name" placeholder="Enter your site name here..." style="height: 30px;"></textarea>

<textarea id="markdown" placeholder="Paste your markdown here...">
# Hello  
This is a sample bio page. You can add links, lists and images!

## Links
- [Github repo](https://github.com/chjk-studios/LinkInBio)
- [Demo link](https://github.com/chjk-studios/LinkInBio)

https://github.com/chjk-studios/LinkInBio
</textarea>

<textarea id="css" placeholder="Write custom css for your site here! A site without css will NOT have any styling!" style="height: 100px; resize: vertical;">
  /* Write custom css for your site here, 
  or just keep it default.
  You can edit these colors to change the basic colors of your site */
  :root {
    --bg: #0d1b2a;
    --text: #e0e1dd;
    --accent: #00ff9d;
    --link: #00b4d8;
  }
  /* Ignore this if you only need basic color settings */
  body {
    background: var(--bg);
    color: var(--text);
    font-family: monospace;
    line-height: 1.6;
    padding: 2rem;
    max-width: 800px;
    margin: auto;
  }
  h1, h2, h3 {
    color: var(--accent);
    margin-top: 1.5rem;
    margin-bottom: 0.5rem;
  }
  a {
    color: var(--link);
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  pre {
    background: #1b263b;
    padding: 1rem;
    border-radius: 6px;
    overflow-x: auto;
  }
  code {
    background: #1b263b;
    padding: 2px 4px;
    border-radius: 4px;
  }
  footer {
    margin-top: 4rem;
    text-align: center;
    font-size: 0.85rem;
    color: #748cab;
  }
</textarea>

<br />
<div class="buttons">
<button onclick="convert()">Convert & Preview</button>
<button id="downloadButton" style="display:none" onclick="downloadHtml()">Download as .HTML</button>
<button id="viewCodeButton" style="display:none" onclick="viewCode()">View Code</button>
</div>
<iframe id="preview"></iframe>

<footer>
  View on <a href="https://github.com/chjk-studios/LinkInBio" target="_blank">Github</a>
</footer>
</main>
<script src="_assets/js/convert.js"></script>

</body>
</html>
